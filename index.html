<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raja Stickers — Original GIFs</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#0f1115;color:#fff}
.wrap{max-width:1100px;margin:auto;padding:24px}
.hero{text-align:center;padding:45px 10px}
h1{font-size:42px;margin:8px 0}
.sub{color:#b9b9c5;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:#171a21;border:1px solid #303642;border-radius:16px;padding:15px;text-align:center}
.card img{width:100%;max-width:300px;height:220px;object-fit:contain;background:#fff;border-radius:10px}
.card h3{margin:12px 0 0}
a{color:#9b4dff}
footer{text-align:center;padding:30px;color:#888}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<div class="sub">RAJA STICKER LAB</div>
<h1>Raja Stickers</h1>
<p class="sub">Original Animated GIFs & Stickers</p>
<p><a href="https://www.instagram.com/rajastickerlab/">Instagram @rajastickerlab</a></p>
</header>

<div class="grid">
<div class="card"><img src="giphy_hi_animated-1.gif" alt="Hi"><h3>Hi</h3></div>
<div class="card"><img src="giphy_ok_animated-1.gif" alt="OK"><h3>OK</h3></div>
<div class="card"><img src="giphy_thanks_animated-1.gif" alt="Thanks"><h3>Thanks</h3></div>
<div class="card"><img src="giphy_yes_animated-1.gif" alt="Yes"><h3>Yes</h3></div>
<div class="card"><img src="giphy_nice_animated-2.gif" alt="Nice"><h3>Nice</h3></div>
<div class="card"><img src="giphy_bye_animated-1.gif" alt="Bye"><h3>Bye</h3></div>
<div class="card"><img src="giphy_good_morning_animated-1.gif" alt="Good Morning"><h3>Good Morning</h3></div>
<div class="card"><img src="giphy_good_job_animated-1.gif" alt="Good Job"><h3>Good Job</h3></div>
<div class="card"><img src="giphy_thank_you_animated-1.gif" alt="Thank You"><h3>Thank You</h3></div>
<div class="card"><img src="giphy_ok2_animated-1.gif" alt="OK 2"><h3>OK!</h3></div>
</div>

<footer>© 2026 Raja Stickers</footer>
</div>
</body>
</html>
